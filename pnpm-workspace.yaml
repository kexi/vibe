packages:
  - "packages/*"

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - devalue
  - "@astrojs/*"
  - fontkitten
  - "@types/*"
  - tsdown
  # Approved for this dependency refresh; keep the exception version-specific.
  - prettier-plugin-astro@1.1.2

nodeLinker: hoisted
publicHoistPattern:
  - "*node-pty*"

# Published launcher dependencies stay exact registry versions; link them locally
# so a frozen install also works before the matching release is published.
linkWorkspacePackages: true

# Upstream ranges retain older releases with disclosed vulnerabilities.
overrides:
  "fast-uri@<3.1.9": "3.1.9"
  "fflate@<0.8.3": "0.8.3"

# Block non-registry sources (github:user/repo, file:, http:, etc.) anywhere in
# the dependency graph. Prevents the wormable optionalDependencies: github:<sha>
# payload technique used in the 2026-05-11 TanStack npm compromise.
blockExoticSubdeps: true

# pnpm 12 reads build approvals from YAML, not the removed .npmrc setting.
strictDepBuilds: true
allowBuilds:
  node-pty: true
  esbuild: true
  sharp: true

# Fail the install if a package transitions to a less-trusted state
# (e.g. signed -> unsigned, public -> private) between resolutions.
trustPolicy: no-downgrade
trustPolicyExclude:
  # 6.x backport published without provenance after the 7.x line gained it;
  # already pinned in pnpm-lock.yaml, so excluding this exact version adds no
  # new exposure. Not excluded unversioned so future versions stay checked.
  - undici-types@6.21.0
  - chokidar@4.0.3
  - vite@6.4.1
