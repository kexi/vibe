packages:
  - "packages/*"

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - devalue
  - "@astrojs/*"
  - fontkitten
  - "@types/*"
  - tsdown

# Block non-registry sources (github:user/repo, file:, http:, etc.) anywhere in
# the dependency graph. Prevents the wormable optionalDependencies: github:<sha>
# payload technique used in the 2026-05-11 TanStack npm compromise.
blockExoticSubdeps: true

# Refuse to run lifecycle scripts for any dependency by default. The
# `onlyBuiltDependencies` allowlist of packages that may run install scripts
# is intentionally kept in `.npmrc` so legacy `npm`/`yarn` consumers honour
# the same allowlist.
strictDepBuilds: true

# The Claude Code CLI (packages/claude-plugin devDependency, used only to
# validate and test the plugin) ships a postinstall that copies its native
# binary over bin/claude. We never run that bin: scripts/claude-plugin-check.ts
# calls cli-wrapper.cjs, which resolves the native optional dependency itself.
# Why not allow the build (`onlyBuiltDependencies`): CI installs with
# --ignore-scripts anyway, and a script that rewrites a ~235 MB binary is
# exactly what strictDepBuilds guards against. Listing it here acknowledges the
# script as reviewed-and-skipped, so strictDepBuilds does not fail the install.
ignoredBuiltDependencies:
  - "@anthropic-ai/claude-code"

# Fail the install if a package transitions to a less-trusted state
# (e.g. signed -> unsigned, public -> private) between resolutions.
trustPolicy: no-downgrade
trustPolicyExclude:
  # 6.x backport published without provenance after the 7.x line gained it;
  # already pinned in pnpm-lock.yaml, so excluding this exact version adds no
  # new exposure. Not excluded unversioned so future versions stay checked.
  - undici-types@6.21.0
  - chokidar@4.0.3
  - vite@6.4.1
