name: Setup toolchain
description: >-
  Provision the development toolchain. On Linux/macOS this enters the Nix flake
  dev shell (single source of truth in flake.nix) and exposes its tools to later
  steps; on Windows, where Nix is unavailable, it falls back to individual setup
  actions pinned to the same versions.
runs:
  using: composite
  steps:
    # --- Linux/macOS: Nix flake dev shell ---
    # Keyed on the flake inputs so the cache invalidates only when the
    # toolchain changes; the restore prefix lets unrelated changes still reuse
    # the previous store. runner.arch is in the key because ci.yml runs both
    # x64 (ubuntu-latest) and arm64 (ubuntu-24.04-arm) Linux runners, whose
    # stores share no paths — an os-only key would let one arch win the save
    # and leave the other permanently cold.
    - name: Install Nix and cache the store
      if: runner.os != 'Windows'
      uses: ./.github/actions/setup-nix
      with:
        primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
        restore-prefix: nix-${{ runner.os }}-${{ runner.arch }}-
    - name: Load dev shell into environment
      if: runner.os != 'Windows'
      shell: bash
      env:
        MISE_HTTP_TIMEOUT: "120"
      run: |
        # Build the flake dev shell once and expose only its declared tool
        # directories on PATH for all subsequent run steps, so they need no
        # `nix develop --command` prefix and stay identical to the Windows path.
        # We export just these tools (not the whole shell PATH) so the system
        # C toolchain stays in front for node-gyp (node-pty) and rustup linking.
        # nu/fish/zsh feed the wrapper round-trip tests, which spawn each shell
        # by name; nushell's binary is `nu`. pwsh is not listed because it comes
        # from the runner image, not the dev shell.
        nix develop --command bash -c '
          for t in node bun pnpm ruby rustup pinact git deno nu fish zsh; do
            dirname "$(command -v "$t")"
          done' | sort -u >> "$GITHUB_PATH"
        echo "SHARP_IGNORE_GLOBAL_LIBVIPS=1" >> "$GITHUB_ENV"

    # --- Windows: individual setup actions (Nix does not run on Windows) ---
    - name: Setup Bun (Windows)
      if: runner.os == 'Windows'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.8
    - name: Setup Node.js (Windows)
      if: runner.os == 'Windows'
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.13.0
    - name: Setup pnpm (Windows)
      if: runner.os == 'Windows'
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      with:
        version: 10.26.2
    # Rust is provided by Nix on Linux/macOS, but Nix does not run on Windows, so
    # the Windows build/test jobs need rustup here. Pin the channel to match
    # rust-toolchain.toml; the targets list pulls the Windows MSVC target.
    - name: Setup Rust (Windows)
      if: runner.os == 'Windows'
      uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
      with:
        toolchain: 1.92.0
        targets: x86_64-pc-windows-msvc
        components: rustfmt, clippy
    # aws-lc-sys (rustls' aws-lc-rs crypto provider) builds C/asm; its asm path on
    # Windows needs NASM, which is not on the windows-latest PATH by default.
    - name: Setup NASM (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
