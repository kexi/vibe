name: Nix

on:
  push:
    branches: [main, develop]
    paths: &nix-paths
      - "flake.nix"
      - "flake.lock"
      # The source build now compiles the Rust workspace, so changes there can
      # break it. (The former pnpm/native inputs no longer feed the Nix build.)
      - "rust/**"
      - "package.json"
      - ".github/workflows/nix.yml"
  # Also run on PRs so a Rust-workspace change that breaks the source build is
  # caught before merge, not only on the post-merge push.
  # Do not use a pull_request paths filter here: branch protection requires the
  # nix-build check, and a workflow-level skip leaves that required check absent.
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # G-8: build the source derivation on BOTH Linux and macOS. The dev only
  # verified `nix build .#fromSource` on macOS locally, and CI previously only
  # exercised Linux, so a macOS-specific source-build break (e.g. the clonefile
  # cfg path or a Darwin-only dependency) could slip through. nix-on-macOS in CI
  # is heavier (a cold runner starts from an empty Nix store) but catches that
  # gap.
  nix-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect Nix-relevant changes
        id: nix_changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "$GITHUB_SHA")

          if printf '%s\n' "$changed_files" | grep -Eq '^((flake\.nix|flake\.lock|package\.json|\.github/workflows/nix\.yml)$|rust/)'; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip Nix build
        if: steps.nix_changes.outputs.should_run == 'false'
        run: echo "No Nix-relevant changes; required check passes without running Nix."

      # setup-nix rather than setup-toolchain: this job runs bare `nix` builds
      # and must not build/enter the dev shell. The key prefix is `nix-build-`
      # — distinct from the dev-shell cache — because cache entries are
      # immutable per key: sharing the key across workflows would let the
      # dev-shell store win the save and the `.#fromSource` build dependencies
      # would never be cached. rust/Cargo.lock is hashed in for the same
      # reason: the fromSource build vendors its crate deps from it (flake.nix
      # `cargoLock.lockFile`), and with an exact primary-key hit the save is
      # skipped, so a key that ignored Cargo.lock would never cache a new
      # dependency set.
      - uses: ./.github/actions/setup-nix
        if: steps.nix_changes.outputs.should_run == 'true'
        with:
          primary-key: nix-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'rust/Cargo.lock') }}
          restore-prefix: nix-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Check flake
        if: steps.nix_changes.outputs.should_run == 'true'
        run: nix flake check

      - name: Build from source
        if: steps.nix_changes.outputs.should_run == 'true'
        run: nix build .#fromSource

      - name: Smoke test
        if: steps.nix_changes.outputs.should_run == 'true'
        run: ./result/bin/vibe --help

      # ubuntu-latest is FHS, so `--help` succeeds even if the binary kept a
      # non-Nix interpreter — which would fail on NixOS. Assert the interpreter
      # was patched into the Nix store so the NixOS failure mode can't pass
      # silently. Linux-only: macOS Mach-O binaries have no ELF interpreter and
      # patchelf does not apply.
      - name: Assert Nix-store ELF interpreter
        if: runner.os == 'Linux' && steps.nix_changes.outputs.should_run == 'true'
        run: |
          interp=$(nix run nixpkgs#patchelf -- --print-interpreter result/bin/vibe)
          echo "interpreter: $interp"
          case "$interp" in
            /nix/store/*) echo "OK: interpreter is in the Nix store" ;;
            *) echo "::error::ELF interpreter is not in /nix/store ($interp); the binary would not run on NixOS"; exit 1 ;;
          esac
