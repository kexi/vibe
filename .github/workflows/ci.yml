name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
    # `labeled` is not one of the default activity types (opened/synchronize/
    # reopened), so without it applying `ci-full` to an open PR would not start a
    # run — the label would only take effect on the next push, which defeats the
    # point of being able to opt a finished PR into the Windows leg.
    #
    # The cost is a duplicate full run whenever ANY label is added to an open PR
    # (the filter is per-event, not per-label). The `concurrency` group below
    # cancels the superseded run, so the duplicate is bounded to whatever the
    # older run had already spent.
    types: [opened, synchronize, reopened, labeled]

# One run per ref: a new push to a PR makes the older run's verdict irrelevant,
# so cancelling it frees the runners (notably the `macos-latest` rust-macos job)
# immediately. Push runs are NOT cancelled — a merge push is the only event that
# runs the full macOS/arm64/Windows matrix, and every push to develop/main is a
# distinct commit that must be validated on its own, so cancelling one would
# leave that commit permanently unverified.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: CI only reads the repository. Jobs that need more must
# request it explicitly at the job level.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - uses: ./.github/actions/setup-takumi-guard
        with:
          api-key: ${{ secrets.TAKUMI_GUARD_API_KEY }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify formatting
        run: bun run fmt:check
      - name: Run linter
        run: bun run lint
      # Documentation i18n (en/ja/zh): triplet completeness, docs-site locale
      # mirroring, and cross-language header links. Pure filesystem inspection —
      # no cargo, no build — so it belongs in the cheap lint job rather than the
      # docs job, which is skipped when nothing under packages/docs/ changed and
      # would therefore miss a root README/docs translation going stale.
      - name: Check documentation i18n sync
        run: pnpm run check:i18n
      # The npm-package tests (launcher shim + the release/packaging scripts)
      # otherwise run only in publish-npm.yml, i.e. after the merge that would
      # have broken them. This job already has pnpm install, so they gate the PR.
      - name: Run npm package tests
        run: pnpm run test:npm
      # THIRD-PARTY-LICENSES.md freshness + the `ring` link guard. Needs cargo
      # (cargo metadata / cargo tree), which setup-toolchain provides here.
      # publish-npm.yml also runs --check, but only immediately before publish —
      # too late to be a PR gate.
      - name: Check third-party license notices
        run: pnpm run check:licenses

  rust-linux:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - name: Check formatting
        working-directory: rust
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Test
        # Turn a missing shell into a hard failure for the wrapper round-trip
        # tests: they skip by default (dev machines rarely have all five), so
        # without this a shell dropping out of the toolchain would silently
        # disable the only live proof that the nu/pwsh wrappers actually cd.
        # nu/fish/zsh come from the Nix dev shell via setup-toolchain; bash and
        # pwsh are preinstalled on the runner image.
        env:
          VIBE_REQUIRE_SHELLS: bash,zsh,fish,nu,pwsh
        run: cargo test --manifest-path rust/Cargo.toml --workspace

  # macOS coverage matters because vibe-native's clonefile path and other
  # cfg(target_os = "macos") code is only compiled (and its tests only run) on a
  # macOS runner. Keep it in the lightweight develop PR gate because macOS is the
  # primary user platform; Linux still runs in the full validation path.
  rust-macos:
    runs-on: macos-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - name: Check formatting
        working-directory: rust
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Test
        # See the rust-linux job: a shell missing from PATH must fail the build
        # rather than silently skip its wrapper round-trip leg.
        env:
          VIBE_REQUIRE_SHELLS: bash,zsh,fish,nu,pwsh
        run: cargo test --manifest-path rust/Cargo.toml --workspace

  # The Windows-only coverage the other jobs structurally cannot provide, in two
  # parts:
  #
  # 1. The whole vibe-core unit suite. Its `#[cfg(windows)]`-only tests
  #    (path-prefix validation, the Windows profile locations, the fast-remove
  #    argv) are compiled AND run nowhere else — on linux/macos they are cfg'd
  #    out entirely, so a break in them would otherwise reach a release. The rest
  #    of the crate runs here too now that its fixtures are platform-portable
  #    (#570); shared tests with internal `cfg(windows)` assertion branches are
  #    only actually exercised by this job.
  # 2. The PowerShell wrapper round-trip: rust-linux/rust-macos run the pwsh leg
  #    on Unix pwsh, which cannot exercise Windows path semantics, vibe.exe
  #    resolution, or `& vibe.exe ... @args` splatting where PowerShell users
  #    actually live.
  #
  # `-p vibe`'s integration suites (eval_contract and friends) are deliberately
  # left out: they spawn the binary and git repeatedly, which is slow on the
  # Windows runner, and they carry no cfg(windows) code of their own. Windows
  # PowerShell 5.1 is not exercised either (the wrapper targets pwsh 7).
  rust-windows:
    # Normally full-run-only (push / release PRs into main), but the `ci-full`
    # label opts a develop PR in, so a change touching Windows-only behavior can
    # prove this leg BEFORE merge rather than discovering it on the push to
    # develop. The workflow is read from the PR's merge commit, so labelling a PR
    # that edits this file takes effect within that same PR.
    if: github.event_name == 'push' || github.base_ref == 'main' || contains(github.event.pull_request.labels.*.name, 'ci-full')
    runs-on: windows-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      # The whole crate runs: its fixtures are platform-portable as of #570, so
      # there is nothing left to scope around.
      - name: vibe-core unit tests
        run: cargo test --manifest-path rust/Cargo.toml -p vibe-core
      - name: Wrapper round-trip test (Windows-native pwsh)
        env:
          VIBE_REQUIRE_SHELLS: pwsh
        run: cargo test --manifest-path rust/Cargo.toml -p vibe --test wrapper_round_trip

  # Compile the shipped Rust binary for every supported target so a
  # target-specific build break is caught before release. The
  # x86_64-apple-darwin entry cross-compiles on the arm64 macos-latest runner
  # via `rustup target add`; the others build natively. The win32-x64 leg builds
  # natively on a Windows runner (MSVC provides the C toolchain
  # aws-lc-sys/aws-lc-rs needs).
  build-rust-binaries:
    if: github.event_name == 'push' || github.base_ref == 'main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: darwin-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build binary (${{ matrix.name }})
        run: cargo build --manifest-path rust/Cargo.toml -p vibe --release --target ${{ matrix.target }}
      - name: Smoke test (${{ matrix.name }})
        # The `darwin-x64` leg is the ONLY one cross-built on an arm64 runner;
        # running it needs Rosetta 2, which may be absent, so a Rosetta gap is a
        # skip (runner-capability, not a binary defect). There is no dedicated
        # Intel-runner CI leg (GitHub's macos-13 runners are scarce and being
        # retired); the x86_64-darwin binary is still built + shipped, just not
        # natively smoke-tested in CI. Every other target runs natively and must
        # launch.
        shell: bash
        run: |
          # cargo emits vibe.exe on Windows, plain vibe elsewhere.
          BIN="rust/target/${{ matrix.target }}/release/vibe"
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="${BIN}.exe"
          fi
          if [ "${{ matrix.name }}" = "darwin-x64" ]; then
            if ! "$BIN" --version; then
              echo "::warning::skipping smoke test: x86_64 binary did not run on this arm64 runner (Rosetta 2 unavailable)"
            fi
          else
            "$BIN" --version
          fi

  build-deb:
    if: github.event_name == 'push' || github.base_ref == 'main'
    strategy:
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      - uses: ./.github/actions/setup-takumi-guard
        with:
          api-key: ${{ secrets.TAKUMI_GUARD_API_KEY }}
      - name: Build Linux binary
        run: cargo build --manifest-path rust/Cargo.toml -p vibe --release --target ${{ matrix.target }}
      - name: Build .deb package
        run: |
          VERSION=$(bun run scripts/get-version.ts)
          bun run scripts/build-deb.ts "$VERSION" ${{ matrix.arch }} "rust/target/${{ matrix.target }}/release/vibe"

      # Inspect the archive (no install, no sudo): a package that drops
      # usr/share/doc/vibe/copyright or THIRD-PARTY-LICENSES.md still passes the
      # smoke test below, so the contents are asserted separately.
      - name: Verify .deb contents
        run: |
          set -euo pipefail
          VERSION=$(bun run scripts/get-version.ts)
          bun run scripts/verify-deb.ts "vibe_${VERSION}_${{ matrix.arch }}.deb"

      # G-11: install the freshly built .deb and run the installed binary, so a
      # broken package layout (wrong install path, missing exec bit, bad control
      # metadata) fails the build instead of shipping. Both legs run on native
      # Linux runners matching the .deb arch, so dpkg can install and execute it.
      - name: Install .deb and smoke test
        run: |
          set -euo pipefail
          VERSION=$(bun run scripts/get-version.ts)
          DEB="vibe_${VERSION}_${{ matrix.arch }}.deb"
          sudo dpkg -i "$DEB"
          installed=$(command -v vibe)
          echo "installed vibe at: $installed"
          # `vibe --version` writes the banner to stderr (stdout is reserved for
          # the shell-eval `cd` contract), so capture both streams.
          out=$(vibe --version 2>&1)
          echo "vibe --version => $out"
          # Exact-match the version on the `vibe <version>[+commit]` line, so e.g.
          # 1.8.1 does not spuriously match a 1.8.10 binary.
          printed=$(printf '%s\n' "$out" | awk '/^vibe /{print $2; exit}')
          if [ "$printed" != "$VERSION" ] && [ "${printed%%+*}" != "$VERSION" ]; then
            echo "version mismatch: expected $VERSION, got $printed" >&2
            exit 1
          fi

  e2e-test:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain

      - uses: ./.github/actions/setup-takumi-guard
        with:
          api-key: ${{ secrets.TAKUMI_GUARD_API_KEY }}

      # Install build dependencies for node-pty (Linux only)
      - name: Install build dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential

      # Install all dependencies (the E2E harness drives the CLI through node-pty)
      - name: Install dependencies
        run: pnpm install --ignore-scripts

      # Build the shipped Rust binary for the E2E tests to exercise.
      - name: Build vibe binary for E2E tests
        run: cargo build --manifest-path rust/Cargo.toml -p vibe --release

      # Build node-pty native addon from source
      - name: Build node-pty
        run: |
          cd node_modules/node-pty
          npm run install -- --build-from-source
        env:
          npm_config_build_from_source: true

      # Verify binary exists and has execute permission
      - name: Verify vibe binary
        run: |
          ls -la rust/target/release/vibe
          file rust/target/release/vibe
          chmod +x rust/target/release/vibe
          ./rust/target/release/vibe --version

      # Run E2E tests with Vitest
      - name: Run E2E tests
        run: pnpm -C packages/e2e run test
        env:
          VIBE_BINARY_PATH: ${{ github.workspace }}/rust/target/release/vibe

  # End-to-end npm install→run on every package manager (G-1/G-2). The shim unit
  # tests mock require.resolve/realpath; this job proves the REAL flow under each
  # package manager's actual on-disk layout (npm hoisted, pnpm .pnpm symlink
  # farm), which is the only place the containment guard (security A-2) and the
  # os/cpu gating are exercised for real. It runs on the host-matching platform
  # package only: building all five targets per runner is unnecessary, and a
  # foreign-arch binary could not be smoke-run anyway.
  npm-install-matrix:
    if: github.event_name == 'push' || github.base_ref == 'main'
    needs: build-rust-binaries
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # npm (hoisted node_modules) and pnpm (.pnpm symlink farm) cover the two
        # distinct install layouts the shim must resolve against. yarn classic is
        # omitted: it is not a realistic global-install path for vibe (and is
        # EOL-bound), its layout mirrors npm's hoisted one, and its strict
        # optionalDependencies resolution fails on the not-yet-published platform
        # packages — adding noise without unique coverage.
        pm: [npm, pnpm]
        exclude:
          # `pnpm add` of the local tarballs is reproducibly SIGKILLed (exit 137)
          # on the macOS runner — a runner/pnpm environment limit, not a shim
          # bug. pnpm's .pnpm symlink-farm layout is OS-independent and is already
          # covered by the ubuntu pnpm leg; macOS still runs npm (hoisted) to
          # cover the OS difference.
          - os: macos-latest
            pm: pnpm
        include:
          # Host platform package + node arch for each runner. The win32 leg is
          # the only proof that the shim's require.resolve(".../bin/vibe") + the
          # extensionless staged binary actually exec under Node's spawnSync on
          # Windows.
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: windows-latest
            platform: win32
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(bun run scripts/get-version.ts)" >> "$GITHUB_OUTPUT"

      # Build the host binary and stage it into its per-platform package, exactly
      # as the release flow does (same scripts), so the packed tarball is the one
      # users would install.
      - name: Build host binary
        run: cargo build --manifest-path rust/Cargo.toml -p vibe --release

      - name: Generate THIRD-PARTY-LICENSES.md
        run: bun run scripts/generate-third-party-licenses.ts

      - name: Stage host platform package
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          # cargo emits vibe.exe on Windows; pass it explicitly so the staging
          # script writes bin/vibe.exe (the shim resolves/spawns the .exe on win32).
          BIN="rust/target/release/vibe"
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="${BIN}.exe"
          fi
          bun run scripts/stage-platform-package.ts \
            --platform "$PLATFORM" --arch "$ARCH" \
            --binary "$BIN"

      # G-3: the published tarball MUST contain bin/vibe (executable), LICENSE
      # and THIRD-PARTY-LICENSES.md. Assert it before packing so a bad `files`
      # glob fails here rather than shipping an empty package.
      #
      # Skipped on Windows: the assertion is platform-INDEPENDENT (the `files`
      # glob is the same package.json on every OS, already verified by the
      # ubuntu/macos legs; LICENSE is not in `files` at all — npm's implicit
      # top-level-LICENSE rule is equally OS-independent, and a missing staged
      # LICENSE already fails stage-platform-package.ts on every leg, Windows
      # included), and the script's `npm pack` spawn does not work under
      # Bun on Windows (Bun's execFile cannot launch the npm.cmd shim). The
      # Windows leg's real purpose — that the shim execs the binary — is covered
      # by the steps below, which run npm/pnpm through Git Bash, not Bun.
      - name: Assert platform and shim tarball contents (G-3)
        if: runner.os != 'Windows'
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          bun run scripts/verify-platform-tarball.ts --package "vibe-${PLATFORM}-${ARCH}"
          # Mirror publish-npm.yml's shim staging so the shim leg of G-3 (npm's
          # implicit top-level-LICENSE inclusion actually firing for this
          # package.json) is proven here in PR CI, not first at publish time.
          cp LICENSE packages/npm/LICENSE
          bun run scripts/verify-platform-tarball.ts --package npm

      - name: Pack shim and platform tarballs
        id: pack
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tgz"
          shim_tgz=$(cd packages/npm && npm pack --pack-destination "$RUNNER_TEMP/tgz" | tail -n1)
          plat_tgz=$(cd "packages/vibe-${PLATFORM}-${ARCH}" && npm pack --pack-destination "$RUNNER_TEMP/tgz" | tail -n1)
          echo "shim=$RUNNER_TEMP/tgz/$shim_tgz" >> "$GITHUB_OUTPUT"
          echo "platform=$RUNNER_TEMP/tgz/$plat_tgz" >> "$GITHUB_OUTPUT"

      # Install BOTH tarballs into a throwaway project with the matrix's package
      # manager. The shim's optionalDependencies can't resolve the (unpublished)
      # platform packages from the registry in a test, so the host platform
      # tarball is installed explicitly alongside the shim. The expectation is
      # exit 0 + the version string from `vibe --version`.
      - name: Install both tarballs and run vibe --version
        id: success
        shell: bash
        env:
          PM: ${{ matrix.pm }}
          SHIM: ${{ steps.pack.outputs.shim }}
          PLAT: ${{ steps.pack.outputs.platform }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          proj="$RUNNER_TEMP/install-ok"
          mkdir -p "$proj"
          cd "$proj"
          npm init -y >/dev/null
          case "$PM" in
            npm)  npm install "$SHIM" "$PLAT" ;;
            pnpm) pnpm add "$SHIM" "$PLAT" ;;
          esac
          # `vibe --version` writes the banner to stderr (stdout is reserved for
          # the shell-eval `cd` contract), so capture both streams. Capture the
          # exit code WITHOUT `set -e` killing us first, so a nonzero exit (e.g.
          # the shim failing to launch the binary on Windows) still surfaces the
          # captured stderr in the log instead of dying silently.
          set +e
          out=$(./node_modules/.bin/vibe --version 2>&1)
          rc=$?
          set -e
          echo "vibe --version (exit $rc) => $out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::vibe --version exited $rc"
            exit 1
          fi
          # Exact-match the version on the `vibe <version>[+commit]` line, so e.g.
          # 1.8.1 does not spuriously match a 1.8.10 binary.
          printed=$(printf '%s\n' "$out" | awk '/^vibe /{print $2; exit}')
          if [ "$printed" != "$VERSION" ] && [ "${printed%%+*}" != "$VERSION" ]; then
            echo "version mismatch: expected $VERSION, got $printed" >&2
            exit 1
          fi

      # The missing-platform case: install ONLY the shim (no platform package).
      # The shim must exit nonzero with the "platform package ... not installed"
      # message rather than crashing or silently doing nothing.
      - name: Assert clear error when platform package is absent
        shell: bash
        env:
          PM: ${{ matrix.pm }}
          SHIM: ${{ steps.pack.outputs.shim }}
        run: |
          set -euo pipefail
          proj="$RUNNER_TEMP/install-missing"
          mkdir -p "$proj"
          cd "$proj"
          npm init -y >/dev/null
          # --no-optional / --ignore-optional so the optionalDependency platform
          # packages are NOT pulled (they would fail to resolve from the registry
          # anyway, but be explicit about reproducing the "missing binary" state).
          case "$PM" in
            npm)  npm install --no-optional "$SHIM" ;;
            pnpm) pnpm add --no-optional "$SHIM" ;;
          esac
          set +e
          out=$(./node_modules/.bin/vibe --version 2>&1)
          code=$?
          set -e
          echo "exit=$code output: $out"
          if [ "$code" -eq 0 ]; then
            echo "::error::shim should fail when the platform package is missing"
            exit 1
          fi
          echo "$out" | grep -F "not installed"

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect docs-relevant changes
        id: docs_changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ github.base_ref }}" = "main" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "$GITHUB_SHA")

          if printf '%s\n' "$changed_files" | grep -Eq '^(packages/docs/|\.github/workflows/ci\.yml$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)'; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Skip docs checks
        if: steps.docs_changes.outputs.should_run == 'false'
        run: echo "No docs-relevant changes; required check passes without running docs checks."
      - uses: ./.github/actions/setup-toolchain
        if: steps.docs_changes.outputs.should_run == 'true'
      - uses: ./.github/actions/setup-takumi-guard
        if: steps.docs_changes.outputs.should_run == 'true'
        with:
          api-key: ${{ secrets.TAKUMI_GUARD_API_KEY }}
      - name: Install dependencies
        if: steps.docs_changes.outputs.should_run == 'true'
        run: pnpm install --filter docs --frozen-lockfile --ignore-scripts
      - name: Lint
        if: steps.docs_changes.outputs.should_run == 'true'
        run: pnpm -C packages/docs lint
      - name: Format check
        if: steps.docs_changes.outputs.should_run == 'true'
        run: pnpm -C packages/docs format
      - name: Type check
        if: steps.docs_changes.outputs.should_run == 'true'
        run: pnpm -C packages/docs check
      - name: Build
        if: steps.docs_changes.outputs.should_run == 'true'
        run: pnpm -C packages/docs build

  pinact-verify:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-toolchain
      # pinact resolves each `uses:` against the GitHub API. Unauthenticated it
      # shares the runner's IP quota (60 req/h) and dies with a 403 on busy
      # hours; GITHUB_TOKEN lifts it to 1000 req/h for this repo.
      - run: pinact run --check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gitleaks:
    runs-on: ubuntu-latest
    # The action comments on the PR via GITHUB_TOKEN, which needs write access to
    # pull requests. Granted only here, not at the top level, so every other job
    # keeps the read-only default. contents:read is restated because declaring
    # job-level permissions drops the inherited top-level set otherwise.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      # fetch-depth: 0 so the action can resolve the PR's base ref and scan
      # every commit in the range (not just the tip), catching a secret added in
      # an intermediate commit even if a later commit removes it. On push it
      # scans the full history of the pushed ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Why the official action instead of the dev-shell gitleaks via a plain
      # `run:` step: it bundles a maintained scanner and posts findings as PR
      # comments. setup-toolchain is dropped since the action ships its own
      # gitleaks binary.
      #
      # Note on config tampering: the action's config precedence is the same as
      # the CLI's (GITLEAKS_CONFIG env / repo-root .gitleaks.toml), so it does
      # NOT prevent a fork PR from editing .gitleaks.toml in the same PR. That
      # evasion is blocked operationally: CODEOWNERS guards .gitleaks.toml and
      # branch protection requires this check to pass before merge.
      #
      # GITLEAKS_LICENSE is required for organization repos only; kexi/vibe is a
      # personal repo, so it is intentionally omitted.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  build:
    needs:
      [
        lint,
        rust-linux,
        rust-macos,
        rust-windows,
        build-rust-binaries,
        build-deb,
        e2e-test,
        npm-install-matrix,
        docs,
        pinact-verify,
        gitleaks,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - name: Check required job results
        shell: bash
        env:
          LINT: ${{ needs.lint.result }}
          RUST_LINUX: ${{ needs.rust-linux.result }}
          RUST_MACOS: ${{ needs.rust-macos.result }}
          RUST_WINDOWS: ${{ needs.rust-windows.result }}
          BUILD_RUST_BINARIES: ${{ needs.build-rust-binaries.result }}
          BUILD_DEB: ${{ needs.build-deb.result }}
          E2E_TEST: ${{ needs.e2e-test.result }}
          NPM_INSTALL_MATRIX: ${{ needs.npm-install-matrix.result }}
          DOCS: ${{ needs.docs.result }}
          PINACT_VERIFY: ${{ needs.pinact-verify.result }}
          GITLEAKS: ${{ needs.gitleaks.result }}
          LIGHT_DEVELOP_PR: ${{ github.event_name == 'pull_request' && github.base_ref == 'develop' }}
        run: |
          set -euo pipefail

          failed=0
          full_only_jobs=" RUST_LINUX RUST_WINDOWS BUILD_RUST_BINARIES BUILD_DEB E2E_TEST NPM_INSTALL_MATRIX "
          for job in \
            LINT \
            RUST_LINUX \
            RUST_MACOS \
            RUST_WINDOWS \
            BUILD_RUST_BINARIES \
            BUILD_DEB \
            E2E_TEST \
            NPM_INSTALL_MATRIX \
            DOCS \
            PINACT_VERIFY \
            GITLEAKS
          do
            result="${!job}"
            case "$result" in
              success)
                echo "$job: $result"
                ;;
              skipped)
                if [ "$LIGHT_DEVELOP_PR" = "true" ] && [[ "$full_only_jobs" == *" $job "* ]]; then
                  echo "$job: $result"
                else
                  echo "::error::$job was skipped unexpectedly"
                  failed=1
                fi
                ;;
              *)
                echo "::error::$job finished with result: $result"
                failed=1
                ;;
            esac
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

          echo "All required builds completed successfully"
