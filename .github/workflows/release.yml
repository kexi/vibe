name: Release

# Releasing is workflow-first: dispatching this workflow on main builds the
# binaries, creates the GitHub Release as a DRAFT with every asset attached,
# verifies that draft, and only then undrafts it. A draft holds no tag, so the
# tag is burned at the undraft — after all artifacts exist AND have been checked
# — which is the order Immutable Releases requires. A GitHub Release is
# therefore never a trigger here: the old `on: release` flow attached assets to
# an already-published release, which Immutable Releases forbids.
#
# Re-running a run whose release already published resumes idempotently: the
# `release` and `update-homebrew` jobs still run, re-verify the published asset
# set and converge the tap, instead of being skipped green (#598). Use "Re-run
# failed jobs" — `prepare` refuses a fresh dispatch whose commit differs from
# the one the published release targets, so a resume can never mix a newer tree
# with the released binaries.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes (markdown). Empty = auto-generated notes"
        required: false
        type: string
      dry_run:
        description: "Build and verify a draft release, then delete it (no publish)"
        required: false
        type: boolean
        default: false

# Serialize releases so one run's draft never races another run's publish
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      should_release: ${{ steps.state.outputs.should_release }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      # Fail (not skip) off-main dispatches: a skipped run still completes as
      # success, which would needlessly wake publish-npm's workflow_run gate.
      - name: Verify dispatch is on main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Stable releases must be dispatched on main (got: $GITHUB_REF)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-toolchain

      - name: Resolve version from package.json
        id: version
        run: |
          VERSION=$(bun run scripts/get-version.ts)
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid stable version: $VERSION (prerelease suffixes belong to beta-release.yml)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # The era rule (2.x = Apache-2.0, >=3.0.0 = MIT, #553) lives in the
      # shared composite action so this workflow and beta-release.yml cannot
      # drift apart; see the action for the full fail-closed rationale.
      - name: Assert LICENSE matches the release version's licensing era
        uses: ./.github/actions/assert-license-era
        with:
          version: ${{ steps.version.outputs.version }}

      - name: Determine release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          # `gh release view` falls back to searching drafts, so distinguish
          # none / draft / published via isDraft instead of exit status alone.
          STATE=none
          if IS_DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$IS_DRAFT" = "true" ]; then STATE=draft; else STATE=published; fi
          fi
          if [ "$STATE" = "published" ]; then
            # should_release=false lets the downstream jobs resume against the
            # published release (#598), and they check out this run's commit.
            # A fresh dispatch after main moved on would therefore hash the
            # OLD released binaries into a formula built from a NEWER tree, so
            # bind the resume to the released commit and fail closed otherwise.
            TARGET=$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)
            if [ "$TARGET" != "$GITHUB_SHA" ]; then
              echo "::error::Release $TAG targets $TARGET but this run is on $GITHUB_SHA; use \"Re-run failed jobs\" on the original run instead of dispatching a fresh one."
              exit 1
            fi
            echo "Release $TAG already published at $TARGET; skipping build (re-run recovery path)."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A pre-existing tag would make the published release point at a
          # commit this run did not build; leftover drafts are handled later.
          # Assignment form: a network failure of ls-remote must fail the step
          # under `set -e`, not read as "no such tag".
          EXISTING_TAG=$(git ls-remote --tags origin "refs/tags/$TAG")
          if [ "$STATE" = "none" ] && [ -n "$EXISTING_TAG" ]; then
            echo "::error::Tag $TAG exists without a published release; delete the tag or bump the version."
            exit 1
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: vibe-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: vibe-linux-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: vibe-darwin-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: vibe-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: vibe-win32-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-toolchain

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      # build.rs reads these so the released binary's --version is accurate. The
      # commit is the released tag's commit; distribution=binary marks it as the
      # standalone release artifact (matching the former --distribution binary).
      - name: Build release binary
        env:
          VIBE_BUILD_COMMIT: ${{ github.sha }}
          VIBE_BUILD_DISTRIBUTION: binary
          VIBE_BUILD_ENV: github-actions
        run: cargo build --manifest-path rust/Cargo.toml -p vibe --release --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          # cargo emits vibe.exe on Windows; the release ASSET is named
          # extensionless (vibe-win32-x64) for symmetry with the other four. The
          # staging script later receives it via --binary and writes bin/vibe.exe
          # into the npm package (so the shim can spawn the PE on Windows).
          SRC="rust/target/${TARGET}/release/vibe"
          if [ "${{ runner.os }}" = "Windows" ]; then
            SRC="${SRC}.exe"
          fi
          cp "$SRC" "$ARTIFACT"

      # Actually launch the binary so any inability to start fails the release.
      - name: Smoke test release binary
        shell: bash
        env:
          BIN: ${{ matrix.artifact }}
          TARGET: ${{ matrix.target }}
        run: |
          # The staged artifact is extensionless on every platform. On Windows,
          # CreateProcess launches a PE by its header, but Git Bash / spawn is
          # more reliable with a .exe name, so smoke-test a .exe copy there.
          RUN="$BIN"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "$BIN" "${BIN}.exe"
            RUN="${BIN}.exe"
          else
            chmod +x "$BIN"
          fi
          # x86_64-apple-darwin is the one entry cross-built on the arm64
          # macos-latest runner; running it needs Rosetta 2. Treat a Rosetta
          # absence as a skip (runner-capability gap, not a binary defect); any
          # other launch failure is a real regression.
          if [ "$TARGET" = "x86_64-apple-darwin" ] && [ "$(uname -m)" = "arm64" ]; then
            if ! out=$(./"$RUN" --version 2>&1); then
              echo "::warning::skipping smoke test for $BIN: x86_64 binary did not run on this arm64 runner (Rosetta 2 unavailable)"
              echo "$out"
              exit 0
            fi
            echo "$out"
            echo "OK: binary launches (via Rosetta)"
            exit 0
          fi
          out=$(./"$RUN" --version 2>&1)
          echo "$out"
          echo "OK: binary launches"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  build-deb:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            binary: vibe-linux-x64
          - arch: arm64
            binary: vibe-linux-arm64

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-toolchain

      - uses: ./.github/actions/setup-takumi-guard
        with:
          api-key: ${{ secrets.TAKUMI_GUARD_API_KEY }}

      # Package the EXACT release binary built by the `build` job — no rebuild.
      # The Rust binary's metadata is baked at compile time, so there is no
      # deb-specific recompile (and no bun/baseclient #490 concern anymore); the
      # same bytes that ship as the release asset go into the .deb.
      - name: Download Linux binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.binary }}
          path: .

      - name: Build .deb package
        env:
          BINARY: ${{ matrix.binary }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          chmod +x "$BINARY"
          bun run scripts/build-deb.ts "$VERSION" "$ARCH" "$BINARY"

      # Inspect the archive before it becomes a release asset: the .deb must
      # carry usr/share/doc/vibe/copyright and THIRD-PARTY-LICENSES.md, neither
      # of which any other release check would notice missing.
      - name: Verify .deb contents
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          bun run scripts/verify-deb.ts "vibe_${VERSION}_${ARCH}.deb"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vibe_${{ matrix.arch }}.deb
          path: vibe_*.deb

  # Smoke-test the per-platform npm package staging on the real release binaries.
  # The authoritative publish (publish-npm.yml) re-stages from the GitHub release
  # assets; this job catches a staging/packaging break during the release run.
  stage-platform-packages:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: vibe-linux-x64
            platform: linux
            arch: x64
          - artifact: vibe-linux-arm64
            platform: linux
            arch: arm64
          - artifact: vibe-darwin-x64
            platform: darwin
            arch: x64
          - artifact: vibe-darwin-arm64
            platform: darwin
            arch: arm64
          - artifact: vibe-win32-x64
            platform: win32
            arch: x64
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-toolchain

      - name: Download binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist-bin

      - name: Generate THIRD-PARTY-LICENSES.md
        run: bun run scripts/generate-third-party-licenses.ts

      - name: Stage platform package
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          chmod +x "dist-bin/$ARTIFACT"
          bun run scripts/stage-platform-package.ts \
            --platform "$PLATFORM" --arch "$ARCH" --binary "dist-bin/$ARTIFACT"

      - name: Upload staged package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-package-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            packages/vibe-${{ matrix.platform }}-${{ matrix.arch }}/package.json
            packages/vibe-${{ matrix.platform }}-${{ matrix.arch }}/bin/vibe*
            packages/vibe-${{ matrix.platform }}-${{ matrix.arch }}/THIRD-PARTY-LICENSES.md
          if-no-files-found: error

  release:
    needs: [prepare, build, build-deb, stage-platform-packages]
    # Resume semantics (#598): should_release=false means the release is already
    # published at THIS run's commit (prepare fails every other abnormal state,
    # including a mismatched commit), so run anyway — the script's re-check
    # no-ops and the verify step re-asserts the published asset set. Previously
    # a skipped `build` skipped this job transitively and the run ended green
    # with the failed step never retried. On a fresh run all three build jobs
    # must have succeeded; !cancelled() keeps cancellation and a failed prepare
    # fatal despite the status-function override of the implicit needs gate.
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      (needs.prepare.outputs.should_release == 'false' ||
        (needs.build.result == 'success' &&
         needs.build-deb.result == 'success' &&
         needs.stage-platform-packages.result == 'success'))
    runs-on: ubuntu-latest
    outputs:
      verified: ${{ steps.verify.outputs.verified }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      # The license files are uploaded as release assets so every downloader
      # gets the terms alongside the binary, and the verifier script runs from
      # the same tree. Why not `ref: <tag>`: prepare fails the run if the tag
      # already exists, so at this point it does not — `gh release create
      # --target $GITHUB_SHA` below is what burns it. Checking out the default
      # `GITHUB_SHA` also guarantees the attached license text matches the
      # commit the binaries were built from, not wherever the branch has since
      # moved to.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-toolchain
      # artifacts/ exists only on a fresh run: a resume (should_release=false)
      # owns no build artifacts, and the release script exits before touching
      # them. Any step added to this job must not assume the directory is there.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.prepare.outputs.should_release == 'true'
        with:
          path: artifacts
          merge-multiple: true

      - name: Create and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          # gh ignores GITHUB_REPOSITORY, and pinning GH_REPO keeps every gh
          # call in this job aimed at this repository regardless of what the
          # checkout's remote happens to say.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          NOTES: ${{ inputs.notes }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # Re-check on re-runs: prepare's verdict may predate a publish that
          # succeeded in the meantime, and on a resume (#598) this is the first
          # gh call — nothing is created, deleted or uploaded past this point.
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = "false" ]; then
            echo "Release $TAG already published; nothing to do."
            exit 0
          fi

          # Drop leftover drafts from failed attempts. Several drafts can share
          # one tag_name and `gh release delete` removes only the first match,
          # so delete by id. Drafts hold no tag, so this never burns one.
          # Assignment form, not `for id in $(gh ...)`: a word list swallows the
          # command's exit status even under `set -e`, so a failed listing would
          # read as "no leftover drafts".
          DRAFT_IDS=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id")
          for id in $DRAFT_IDS; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
            echo "Deleted leftover draft release id=${id}"
          done

          # Why not `artifacts/*`: download-artifact with `merge-multiple: true`
          # flattens the five `platform-package-*` artifacts into the same dir,
          # so a bare glob would upload their `package.json` and pick up
          # whichever of the five identical `THIRD-PARTY-LICENSES.md` copies
          # won the merge — an asset whose provenance is a race. The license
          # files are instead taken from the checkout above, which is the
          # release commit itself. publish-npm.yml regenerates the package
          # metadata locally per-matrix and only pulls the named binary via
          # `gh release download --pattern`, so it is unaffected either way.
          #
          # Exact-name gate (#597): the script verifies every expected file by
          # name and prints the verified paths, which become the upload list —
          # so the checked set and the uploaded set cannot diverge. Why not a
          # glob plus a count: 4 binaries + 3 .debs + 2 licenses also totals 9,
          # which is how a missing platform binary used to publish. Why the
          # assignment and not `mapfile < <(...)`: process substitution swallows
          # the gate's exit status under `set -e`.
          ASSET_LIST=$(bun run scripts/verify-release-files.ts \
            --channel stable --version "$VERSION" --artifacts-dir artifacts)
          mapfile -t ASSETS <<<"$ASSET_LIST"
          # Belt and braces: an empty ASSET_LIST would make mapfile produce a
          # one-element array holding "", passing a bare empty argument to
          # `gh release create`. Unreachable while the gate exits 1 on failure,
          # so it must say so if it ever fires — a bare test would exit 1 with
          # no annotation and no message.
          if [ -z "$ASSET_LIST" ]; then
            echo "::error::asset gate produced an empty upload list"
            exit 1
          fi

          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > notes.md
            NOTES_ARGS=(--notes-file notes.md)
          else
            # Anchor auto-notes to the previous stable so a beta prerelease in
            # between does not shrink the changelog range.
            PREV=$(gh release list --exclude-pre-releases --limit 1 \
              --json tagName --jq '.[0].tagName')
            NOTES_ARGS=(--generate-notes)
            [ -n "$PREV" ] && NOTES_ARGS+=(--notes-start-tag "$PREV")
          fi

          if [ "$DRY_RUN" = "true" ]; then
            # Exercise the full upload path against an explicit draft, then
            # delete it. workflow_run events cannot see this run's dispatch
            # inputs, so the follow-up publish-npm run detects the deleted
            # release itself and skips gracefully (resolve-release's
            # proceed=false path).
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "$TAG" "${NOTES_ARGS[@]}" "${ASSETS[@]}"
            # Set-equality check before the draft is discarded: every expected
            # name present and usable, and nothing else attached.
            gh release view "$TAG" --json assets \
              | bun run scripts/verify-release-assets.ts --channel stable --version "$VERSION"
            gh release delete "$TAG" --yes
            echo "Dry run OK: draft carried all ${#ASSETS[@]} expected assets and was deleted."
            exit 0
          fi

          # Create as a DRAFT and undraft only after the assets check out.
          # Why not `gh release create` straight to published: that call is
          # atomic over its uploads but not over their contents, so a release
          # missing LICENSE / THIRD-PARTY-LICENSES.md would already be public
          # (and its tag burned) by the time any verification could look at it.
          # Immutable Releases forbids fixing that in place, and the tag cannot
          # be reused — the only remedy would be burning a version number. A
          # draft holds no tag, so a failure here leaves nothing published and
          # the cleanup above reclaims it on the next attempt.
          gh release create "$TAG" --draft --target "$GITHUB_SHA" \
            --title "$TAG" "${NOTES_ARGS[@]}" "${ASSETS[@]}"

          # Set-equality gate: every expected name present and usable, and
          # nothing else attached — an extra asset can no longer stand in for a
          # missing binary the way a bare count allowed.
          gh release view "$TAG" --json assets \
            | bun run scripts/verify-release-assets.ts --channel stable --version "$VERSION"

          # Everything verified: burn the tag and go public. --latest is set
          # here rather than at create time because a draft cannot be latest.
          gh release edit "$TAG" --draft=false --latest
          echo "Published $TAG with ${#ASSETS[@]} assets."

      # Post-publish confirmation, distinct from the pre-publish gate inside the
      # step above: that one decides whether to publish at all, this one asserts
      # that undrafting did not change what the release carries. Cheap, and it
      # is the state downstream consumers (Homebrew, publish-npm) actually see.
      # On a resume run (#598) it is the only substantive verification, since
      # the step above exits early — which is why update-homebrew gates on the
      # `verified` output rather than on this job merely succeeding.
      - name: Verify published release carries the full asset set
        id: verify
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets \
            | bun run scripts/verify-release-assets.ts --channel stable --version "$VERSION"
          echo "verified=true" >> "$GITHUB_OUTPUT"

  update-homebrew:
    needs: [prepare, release]
    # dry_run publishes nothing, so there is no release to mirror to the tap.
    # The explicit needs.release check replaces the implicit gate that
    # `!cancelled()` overrides, and `verified` makes the post-publish asset
    # check load-bearing for the tap: on a resume (#598) `release` succeeds via
    # its early exit, so success alone would not mean anything was verified.
    if: >-
      !cancelled() && inputs.dry_run != true &&
      needs.release.result == 'success' &&
      needs.release.outputs.verified == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit
      # Guard against rolling the tap backwards. Making `release` resumable
      # (#598) also made this job reachable on a re-run of an OLD run: prepare's
      # commit-binding check compares the release to ITS OWN run's commit, which
      # still matches, so a 3.1.0 run re-run after 3.2.0 shipped would rewrite
      # the unversioned Formula/vibe.rb back to 3.1.0 and push it. Why isLatest
      # and not a version comparison: `gh release edit --draft=false --latest`
      # is what publishing sets, so GitHub's own answer to "which stable is
      # current" is the same fact the tap is supposed to mirror. Skipping (not
      # failing) keeps the re-run's purpose — repairing an old release's assets
      # or npm publish — from being blocked by an untouchable tap.
      #
      # Why `release list` and not `release view "$TAG" --json isLatest`:
      # isLatest is a `release list` field only; `release view` does not expose
      # it and would fail the step on every release, latest included.
      # --exclude-drafts because an authenticated `release list` returns this
      # repo's leftover drafts too, and a draft from a newer failed attempt must
      # not read as "something newer already shipped".
      - name: Confirm this release is still the latest stable
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          # Fetch a window and pick isLatest inside jq: `--limit 1` would take
          # one release and only THEN filter, so any newer entry at the head
          # would yield "" and skip the tap on a genuinely-latest release.
          LATEST=$(gh release list --exclude-drafts --exclude-pre-releases --limit 100 \
            --json tagName,isLatest --jq '[.[] | select(.isLatest)][0].tagName // ""')
          if [ "$LATEST" != "$TAG" ]; then
            echo "::warning::$TAG is no longer the latest stable release (${LATEST:-none} is); leaving the Homebrew tap untouched."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Download released binaries
        if: steps.latest.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          # The tap must hash the bytes users actually download, and on a resume
          # run (#598) this run holds no build artifacts — the published release
          # is the canonical source either way. Exact names rather than
          # `vibe-darwin-*` globs, for the same reason the asset gate names
          # every file (#597): a future asset must not silently join this set.
          gh release download "$TAG" --dir artifacts \
            --pattern vibe-darwin-arm64 --pattern vibe-darwin-x64 \
            --pattern vibe-linux-arm64 --pattern vibe-linux-x64
          # `gh release download` exits 0 as long as ANY --pattern matched, so
          # name the missing file here rather than letting sha256sum fail one
          # step later with the diagnostic pointing at the wrong place.
          ls artifacts/vibe-darwin-arm64 artifacts/vibe-darwin-x64 \
            artifacts/vibe-linux-arm64 artifacts/vibe-linux-x64 >/dev/null

      - name: Calculate SHA256
        id: sha256
        if: steps.latest.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          # Assignment form: inside `echo "$(...)"` a sha256sum failure would be
          # swallowed and write an empty output under `set -e`.
          DARWIN_ARM64=$(sha256sum artifacts/vibe-darwin-arm64 | cut -d ' ' -f 1)
          DARWIN_X64=$(sha256sum artifacts/vibe-darwin-x64 | cut -d ' ' -f 1)
          LINUX_ARM64=$(sha256sum artifacts/vibe-linux-arm64 | cut -d ' ' -f 1)
          LINUX_X64=$(sha256sum artifacts/vibe-linux-x64 | cut -d ' ' -f 1)
          {
            echo "darwin_arm64=$DARWIN_ARM64"
            echo "darwin_x64=$DARWIN_X64"
            echo "linux_arm64=$LINUX_ARM64"
            echo "linux_x64=$LINUX_X64"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.latest.outputs.proceed == 'true'
        with:
          path: vibe-source

      - name: Update Homebrew formula
        if: steps.latest.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # This job only mirrors stable releases; the beta channel formula
          # (vibe-beta.rb) is owned by beta-release.yml.
          FORMULA_NAME="vibe"
          FORMULA_TEMPLATE="vibe.rb"

          # Validate version format
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Invalid version format: $VERSION"
            exit 1
          fi

          # Validate SHA256 values are not empty
          SHA_DARWIN_ARM64="${{ steps.sha256.outputs.darwin_arm64 }}"
          SHA_DARWIN_X64="${{ steps.sha256.outputs.darwin_x64 }}"
          SHA_LINUX_ARM64="${{ steps.sha256.outputs.linux_arm64 }}"
          SHA_LINUX_X64="${{ steps.sha256.outputs.linux_x64 }}"
          for sha_val in "$SHA_DARWIN_ARM64" "$SHA_DARWIN_X64" "$SHA_LINUX_ARM64" "$SHA_LINUX_X64"; do
            if [ -z "$sha_val" ]; then
              echo "Error: One or more SHA256 values are empty"
              exit 1
            fi
          done

          gh repo clone kexi/homebrew-tap homebrew-tap

          # Copy template from source repository
          cp "vibe-source/Formula/${FORMULA_TEMPLATE}" "homebrew-tap/Formula/${FORMULA_TEMPLATE}"
          cd homebrew-tap

          # Replace placeholders with actual values
          sed -i "s/VERSION_PLACEHOLDER/$VERSION/g" "Formula/${FORMULA_TEMPLATE}"
          sed -i "s/SHA256_DARWIN_ARM64/${{ steps.sha256.outputs.darwin_arm64 }}/g" "Formula/${FORMULA_TEMPLATE}"
          sed -i "s/SHA256_DARWIN_X64/${{ steps.sha256.outputs.darwin_x64 }}/g" "Formula/${FORMULA_TEMPLATE}"
          sed -i "s/SHA256_LINUX_ARM64/${{ steps.sha256.outputs.linux_arm64 }}/g" "Formula/${FORMULA_TEMPLATE}"
          sed -i "s/SHA256_LINUX_X64/${{ steps.sha256.outputs.linux_x64 }}/g" "Formula/${FORMULA_TEMPLATE}"

          # Verify all placeholders were replaced
          if grep -q "PLACEHOLDER" "Formula/${FORMULA_TEMPLATE}"; then
            echo "Error: Placeholders were not replaced correctly"
            grep "PLACEHOLDER" "Formula/${FORMULA_TEMPLATE}"
            exit 1
          fi

          # The tap is a separately-published statement of vibe's license; a
          # formula still claiming the pre-v3 Apache-2.0 terms must not ship.
          # The check itself is shared with beta-release.yml (../vibe-source is
          # this repo's checkout — the same tree the formula was copied from).
          bash ../vibe-source/scripts/assert-formula-license.sh "Formula/${FORMULA_TEMPLATE}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Formula/${FORMULA_TEMPLATE}"

          # Versioned formula (vibe@X.Y.Z.rb) so older stable versions stay
          # installable side by side.
          # Compute Homebrew class_s-compatible class name via Ruby
          CLASSNAME=$(ruby -e "
            v = '${VERSION}'.capitalize
            v = v.gsub(/[-_.\s]([a-zA-Z0-9])/) { Regexp.last_match(1).upcase }
            puts v
          ")
          VERSIONED_FORMULA="vibe@${VERSION}.rb"

          cp "../vibe-source/Formula/vibe-versioned.rb" "Formula/${VERSIONED_FORMULA}"
          sed -i "s/CLASSNAME_PLACEHOLDER/$CLASSNAME/g" "Formula/${VERSIONED_FORMULA}"
          sed -i "s/VERSION_PLACEHOLDER/$VERSION/g" "Formula/${VERSIONED_FORMULA}"
          sed -i "s/SHA256_DARWIN_ARM64/${{ steps.sha256.outputs.darwin_arm64 }}/g" "Formula/${VERSIONED_FORMULA}"
          sed -i "s/SHA256_DARWIN_X64/${{ steps.sha256.outputs.darwin_x64 }}/g" "Formula/${VERSIONED_FORMULA}"
          sed -i "s/SHA256_LINUX_ARM64/${{ steps.sha256.outputs.linux_arm64 }}/g" "Formula/${VERSIONED_FORMULA}"
          sed -i "s/SHA256_LINUX_X64/${{ steps.sha256.outputs.linux_x64 }}/g" "Formula/${VERSIONED_FORMULA}"

          # Verify all placeholders were replaced
          if grep -q "PLACEHOLDER" "Formula/${VERSIONED_FORMULA}"; then
            echo "Error: Placeholders were not replaced correctly in versioned formula"
            grep "PLACEHOLDER" "Formula/${VERSIONED_FORMULA}"
            exit 1
          fi

          bash ../vibe-source/scripts/assert-formula-license.sh "Formula/${VERSIONED_FORMULA}"

          git add "Formula/${VERSIONED_FORMULA}"

          # Skip the commit when the formula is already up to date: on a re-run
          # of a succeeded release the regenerated formula is byte-identical
          # (builds are reproducible), and a bare `git commit` would exit 1 and
          # fail the whole run, closing publish-npm's workflow_run success gate.
          if git diff --cached --quiet; then
            echo "Formula already up to date for $VERSION; nothing to commit."
            exit 0
          fi

          git commit -m "Update ${FORMULA_NAME} to $VERSION"
          git push --quiet https://x-access-token:${GH_TOKEN}@github.com/kexi/homebrew-tap.git HEAD:main
