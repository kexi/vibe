name: Publish to npm

# Runs AFTER the Release workflow succeeds, not on the `release` event.
#
# Why workflow_run (security/correctness C-1): the Release workflow is
# dispatched on main, builds the binaries, and creates + publishes the GitHub
# Release itself with every asset attached. It does so with GITHUB_TOKEN, and
# events raised by GITHUB_TOKEN never trigger other workflows — so an
# `on: release` trigger here would simply never fire. Gating on
# `workflow_run: completed` (success) is the only link that works, and it also
# guarantees the release and its assets exist before we `gh release download`
# them. The `workflows: ["Release"]` filter must match release.yml's top-level
# `name:` ("Release").
#
# npm OIDC trusted publishing is registered against THIS file name
# (publish-npm.yml); do not rename or merge this workflow.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read
  id-token: write # Required for npm provenance

jobs:
  # Establish the release tag/version and enforce the publish gate. The Release
  # workflow is dispatched on main, so workflow_run.head_branch is "main" (not
  # the tag) and head_sha is the exact commit the release was built from. The
  # tag is derived from that commit's package.json — the same source release.yml
  # used to name the release — and then verified against the release itself:
  #   - the triggering Release run must have succeeded (job-level `if` below),
  #   - the Release run must have been dispatched on main,
  #   - the release must exist and be published — "Release succeeded but no
  #     release exists" is reachable only via dry_run (which deletes its
  #     draft), so that case is a benign skip (proceed=false), not a failure,
  #   - the release must NOT be a prerelease (beta releases are excluded), and
  #   - the release's target commit must equal the commit that was built
  #     (release.yml passes --target "$GITHUB_SHA").
  # All downstream jobs consume `resolve-release.outputs.{tag,version}` instead
  # of GITHUB_REF_NAME, and check out `head_sha` so they validate the released
  # commit even if main has moved on since.
  resolve-release:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      head_sha: ${{ github.event.workflow_run.head_sha }}
      proceed: ${{ steps.meta.outputs.proceed }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: ./.github/actions/setup-toolchain

      - name: Resolve release tag and enforce stable-release gate
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$HEAD_BRANCH" != "main" ]; then
            echo "::error::the Release run was not dispatched on main (got: $HEAD_BRANCH)"
            exit 1
          fi

          VERSION=$(bun run scripts/get-version.ts)
          # Validate the version (and thus the tag) so it cannot inject shell.
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::unexpected stable version in package.json: $VERSION"
            exit 1
          fi
          TAG="v${VERSION}"

          # "Release run succeeded but no release exists for the tag" is
          # reachable only through dry_run (it deletes its draft; every other
          # success path leaves a published release, and create failures never
          # pass the conclusion == success gate). Skip instead of failing so
          # rehearsals do not produce red runs indistinguishable from a real
          # publish breakage.
          if ! INFO=$(gh release view "$TAG" \
              --repo "${GITHUB_REPOSITORY}" \
              --json isDraft,isPrerelease,targetCommitish \
              --jq '[.isDraft, .isPrerelease, .targetCommitish] | @tsv' 2>/dev/null); then
            echo "::notice::release $TAG not found — dry_run rehearsal; skipping npm publish."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r IS_DRAFT IS_PRERELEASE TARGET <<<"$INFO"

          if [ "$IS_DRAFT" != "false" ]; then
            echo "::error::release $TAG is still a draft; nothing to publish."
            exit 1
          fi
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "::error::publish-npm only runs for stable releases (not prereleases)."
            exit 1
          fi
          # release.yml creates the release with --target "$GITHUB_SHA", so this
          # proves the tag points at exactly the commit the Release run built.
          if [ "$TARGET" != "$HEAD_SHA" ]; then
            echo "::error::release target ($TARGET) is not the commit the Release run built ($HEAD_SHA)."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          echo "Resolved stable release: tag=$TAG version=$VERSION sha=$HEAD_SHA"

  # Verify all versions are in sync before any build/publish
  verify-versions:
    needs: resolve-release
    # Skipping here propagates through `needs` to every downstream job, so a
    # dry_run rehearsal ends the whole workflow green with nothing published.
    if: needs.resolve-release.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      # Pin to the released commit: a commit landing on main between the
      # Release run and this workflow must not shift what gets validated.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.head_sha }}

      - uses: ./.github/actions/setup-toolchain

      - name: Verify package.json version matches tag
        env:
          TAG_VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: Version mismatch!"
            echo "  Git tag version: $TAG_VERSION"
            echo "  package.json version: $PKG_VERSION"
            exit 1
          fi

          echo "package.json version validation passed: $PKG_VERSION"

      - name: Verify .bmp.yml version matches tag
        env:
          TAG_VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          BMP_VERSION=$(grep -E '^version:' .bmp.yml | head -1 | sed -E 's/^version:[[:space:]]*//')
          if [ "$TAG_VERSION" != "$BMP_VERSION" ]; then
            echo "::error::.bmp.yml version ($BMP_VERSION) does not match release tag version ($TAG_VERSION)"
            exit 1
          fi
          echo ".bmp.yml version validation passed: $BMP_VERSION"

      - name: Verify all versions are in sync (bmp validation over every manifest)
        # No-arg bmp substitutes .bmp.yml's version into every configured pattern and
        # fails (exit 1) if any file is missing it — including the pnpm-lock.yaml
        # importer specifiers that sync-version.ts never covered (the v2.1.0/v2.1.1
        # frozen-lockfile release breakage). --frozen (in the pnpm script) pins bmp's
        # transitive JSR deps via the committed deno.lock.
        run: pnpm run bmp

      - name: Verify lockfile is installable (frozen)
        # Defense in depth for the bmp-maintained lockfile edits: a release commit
        # that bypassed PR CI still cannot publish with a specifier/version mismatch.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run manifest registration guards (packages/npm tests)
        # The bmp-manifest-registration vitest guards catch what bmp cannot: an
        # unregistered packages/vibe-* platform dir, an optionalDependency set
        # mismatch, or version drift between .bmp.yml and the committed manifests
        # and lockfile. sync-version.ts --check used to run these structural
        # checks at release time; keep them on the release gate, not only PR CI.
        run: pnpm run test:npm

      - name: Verify THIRD-PARTY-LICENSES.md is up to date
        run: bun run scripts/generate-third-party-licenses.ts --check

  # Security audit for the shipped Rust dependency tree (runs once, not per
  # platform). Audits rust/ — the shipped binary the @kexi/vibe-<platform>
  # packages distribute (pulls in aws-lc-rs / rustls / etc). The old napi crate
  # under packages/native was removed in Phase 6, so it is no longer audited.
  security-audit:
    needs: [resolve-release, verify-versions]
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.head_sha }}

      - uses: ./.github/actions/setup-toolchain

      - name: Install cargo-audit
        # Pinned + --locked: an unpinned install resolves fresh dependency
        # versions at publish time, which broke when kstring 2.0.4 started
        # requiring a newer rustc than rust-toolchain.toml pins.
        run: cargo install cargo-audit@0.22.2 --locked

      - name: Audit shipped Rust binary (rust/)
        run: cargo audit --file rust/Cargo.lock

  # Publish the five per-platform binary packages (@kexi/vibe-<platform>-<arch>).
  # Each downloads its binary from the GitHub release assets and stages THAT
  # file (no rebuild), so the published npm bytes equal the release artifact
  # bytes by construction (security B-2); an explicit sha256 compare backs this
  # up. An `npm view` idempotency guard (security D-1) skips a version already on
  # the registry so re-runs are safe. The assets are guaranteed to exist because
  # this workflow only runs after the Release workflow finished (security C-1).
  publish-platform-packages:
    needs: [resolve-release, security-audit, verify-versions]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: vibe-linux-x64
            artifact: vibe-linux-x64
            platform: linux
            arch: x64
          - package: vibe-linux-arm64
            artifact: vibe-linux-arm64
            platform: linux
            arch: arm64
          - package: vibe-darwin-x64
            artifact: vibe-darwin-x64
            platform: darwin
            arch: x64
          - package: vibe-darwin-arm64
            artifact: vibe-darwin-arm64
            platform: darwin
            arch: arm64
          - package: vibe-win32-x64
            artifact: vibe-win32-x64
            platform: win32
            arch: x64
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.head_sha }}

      - uses: ./.github/actions/setup-toolchain

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Idempotency guard (skip if already published)
        id: guard
        env:
          PKG: "@kexi/${{ matrix.package }}"
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          if npm view "${PKG}@${VERSION}" version >/dev/null 2>&1; then
            echo "${PKG}@${VERSION} already published; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release binary
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT: ${{ matrix.artifact }}
          TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          mkdir -p dist-bin
          gh release download "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "$ARTIFACT" \
            --dir dist-bin

      - name: Generate THIRD-PARTY-LICENSES.md
        if: steps.guard.outputs.skip != 'true'
        run: bun run scripts/generate-third-party-licenses.ts

      - name: Stage platform package
        if: steps.guard.outputs.skip != 'true'
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          chmod +x "dist-bin/$ARTIFACT"
          bun run scripts/stage-platform-package.ts \
            --platform "$PLATFORM" --arch "$ARCH" --binary "dist-bin/$ARTIFACT"

      - name: Assert tarball contents (bin/vibe + LICENSE + THIRD-PARTY-LICENSES.md) (G-3)
        if: steps.guard.outputs.skip != 'true'
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: bun run scripts/verify-platform-tarball.ts --package "vibe-${PLATFORM}-${ARCH}"

      - name: Assert staged binary matches release artifact (security B-2)
        if: steps.guard.outputs.skip != 'true'
        env:
          ARTIFACT: ${{ matrix.artifact }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          src_sha=$(sha256sum "dist-bin/$ARTIFACT" | cut -d ' ' -f 1)
          # The Windows package stages bin/vibe.exe; every other platform bin/vibe.
          binname="vibe"; [ "$PLATFORM" = "win32" ] && binname="vibe.exe"
          staged="packages/vibe-${PLATFORM}-${ARCH}/bin/${binname}"
          staged_sha=$(sha256sum "$staged" | cut -d ' ' -f 1)
          echo "release artifact: $src_sha"
          echo "staged npm bin : $staged_sha"
          if [ "$src_sha" != "$staged_sha" ]; then
            echo "::error::staged binary sha256 != release artifact sha256"
            exit 1
          fi
          echo "OK: staged binary is byte-identical to the release artifact"

      - name: Validate version consistency
        if: steps.guard.outputs.skip != 'true'
        env:
          TAG_VERSION: ${{ needs.resolve-release.outputs.version }}
        working-directory: packages/vibe-${{ matrix.platform }}-${{ matrix.arch }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::version mismatch: tag=$TAG_VERSION pkg=$PKG_VERSION"
            exit 1
          fi
          echo "Version validation passed: $TAG_VERSION"

      - name: Publish @kexi/${{ matrix.package }}
        if: steps.guard.outputs.skip != 'true'
        working-directory: packages/vibe-${{ matrix.platform }}-${{ matrix.arch }}
        # Auth is OIDC trusted publishing (configured on npmjs.com per package
        # for this repo + publish-npm.yml), granted via id-token: write. No
        # NODE_AUTH_TOKEN on purpose: an env token takes precedence over OIDC,
        # so a stale secret would break the publish. Caveat: OIDC cannot CREATE
        # a brand-new package (it 404s on the initial PUT) — any future new
        # package needs a one-off token for its first publish only.
        run: npm publish --provenance --access public

  # Publish @kexi/vibe (the launcher shim). It needs ALL five platform packages
  # to be published first (security D-1) so a freshly published shim never
  # resolves a not-yet-published optionalDependency. @kexi/vibe depends only on
  # those per-platform binary packages (the Rust binary statically links its own
  # clone code; the old @kexi/vibe-native napi package was removed in Phase 6).
  # The shim ships only bin/vibe.cjs — no tsdown build and no version.ts
  # generation are needed.
  publish-cli:
    needs: [resolve-release, publish-platform-packages]
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release.outputs.head_sha }}

      - uses: ./.github/actions/setup-toolchain

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Idempotency guard (skip if already published)
        id: guard
        env:
          VERSION: ${{ needs.resolve-release.outputs.version }}
        run: |
          if npm view "@kexi/vibe@${VERSION}" version >/dev/null 2>&1; then
            echo "@kexi/vibe@${VERSION} already published; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate version consistency
        if: steps.guard.outputs.skip != 'true'
        env:
          TAG_VERSION: ${{ needs.resolve-release.outputs.version }}
        working-directory: packages/npm
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")

          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Error: Version mismatch!"
            echo "  Git tag version: $TAG_VERSION"
            echo "  package.json version: $PKG_VERSION"
            exit 1
          fi

          echo "Version validation passed: $TAG_VERSION"

      - name: Stage LICENSE into the shim package
        if: steps.guard.outputs.skip != 'true'
        # npm includes a top-level LICENSE in the tarball irrespective of
        # `files`, so copying it here is enough to publish vibe's terms. Not
        # committed under packages/npm/: the root LICENSE is canonical and a
        # checked-in copy would be a second place to keep in sync.
        run: |
          cp LICENSE packages/npm/LICENSE
          test -s packages/npm/LICENSE

      - name: Assert shim tarball contents (bin/vibe.cjs + LICENSE) (G-3)
        if: steps.guard.outputs.skip != 'true'
        # Asserting the source file exists only proves the cp ran; this checks
        # what npm will actually pack. `files` does not list LICENSE, so the
        # tarball's contents rest entirely on npm's implicit-inclusion
        # behaviour — verify it here rather than trusting it, with the same
        # unit-tested script the platform packages use.
        run: bun run scripts/verify-platform-tarball.ts --package npm

      - name: Publish @kexi/vibe
        if: steps.guard.outputs.skip != 'true'
        working-directory: packages/npm
        # See the platform publish step: auth is OIDC trusted publishing;
        # deliberately no NODE_AUTH_TOKEN.
        run: npm publish --provenance --access public
