[package]
name = "vibe"
version = "4.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Git worktree helper CLI"
build = "build.rs"

[lints]
workspace = true

[[bin]]
name = "vibe"
path = "src/main.rs"

[dependencies]
vibe-core.workspace = true
clap = { workspace = true }
anyhow.workspace = true

[dev-dependencies]
# Enable vibe-core's in-memory fakes (FakeIo, FakeHttpClient, ...) for the
# binary's integration tests.
vibe-core = { workspace = true, features = ["test-util"] }
vibe-test-support.workspace = true
# Real-binary eval-contract integration tests build temp git worktrees.
tempfile.workspace = true
# The eval-contract test parses `vibe list --json` output, so it asserts on a
# real document rather than on substrings a malformed payload would also satisfy.
serde_json.workspace = true
